name: accuracy
title: 精度测试（8 场景 × 250 = 2,000 样本）
description: 8 场景 × 250 条固定样本；逐行判题（5 类确定性判题器），输出场景分/宏平均/配对 Δ。样本由
  tool/dataset/accuracy/build.py 从 dataset/raw 的上游数据确定性抽样构建，testset.jsonl 为 gitignored
  离线资产（见 dataset/test/accuracy/manifest.json）。
method: accuracy
