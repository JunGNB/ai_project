name: performance
title: 性能测试（8 场景 × 1K/8K/32K × 10 target，240 measured）
description: 性能测试集：每个场景 10 个 target，同一 target 渲染 1K/8K/32K 三档；样本由 tool/dataset/performance/build.py
  从 dataset/raw 的上游数据确定性构建，并由 tool/dataset/performance/align.py 在运行前用目标模型 tokenizer
  对齐到精确的 prompt token 数（1024/8192/32768，0 容差）。strict_input_tokens=true 时运行器要求逐样本 prompt
  token 数严格等于目标值，不等即跳过记录，不做误差带统计。含中文场景；生成长度 max_tokens=50。
scenarios:
  knowledge_qa:
    dataset: perf_jsonl
    dataset_params:
      scenario: knowledge_qa
      path: dataset/test/performance/testset.jsonl
  instruction_following:
    dataset: perf_jsonl
    dataset_params:
      scenario: instruction_following
      path: dataset/test/performance/testset.jsonl
  long_context:
    dataset: perf_jsonl
    dataset_params:
      scenario: long_context
      path: dataset/test/performance/testset.jsonl
  math_logic:
    dataset: perf_jsonl
    dataset_params:
      scenario: math_logic
      path: dataset/test/performance/testset.jsonl
  coding:
    dataset: perf_jsonl
    dataset_params:
      scenario: coding
      path: dataset/test/performance/testset.jsonl
  general_agent:
    dataset: perf_jsonl
    dataset_params:
      scenario: general_agent
      path: dataset/test/performance/testset.jsonl
  search_agent:
    dataset: perf_jsonl
    dataset_params:
      scenario: search_agent
      path: dataset/test/performance/testset.jsonl
  multilingual:
    dataset: perf_jsonl
    dataset_params:
      scenario: multilingual
      path: dataset/test/performance/testset.jsonl
sampling:
  seed: 42
  targets_per_scenario: 10
  method: sha256(seed|id) + stratified largest remainder
buckets:
  1k: 1024
  8k: 8192
  32k: 32768
strict_input_tokens: true
max_tokens: 50
