name: performance
title: 性能测试（8 场景 × 1K/4K/32K × 10 样本）
description: 性能专用样本集：每个样本由「完整主材料 + 可裁剪补充材料」构成，运行前由 runner 按目标模型 tokenizer 把 prompt
  精确对齐到 1K/4K/32K（0 容差）；固定 50-token 解码窗口（可在 testset/CLI/Web 覆盖）。
scenarios:
  knowledge_qa:
    dataset: perf_jsonl
    dataset_params:
      scenario: knowledge_qa
      path: dataset/test/performance/testset.jsonl
  instruction_following:
    dataset: perf_jsonl
    dataset_params:
      scenario: instruction_following
      path: dataset/test/performance/testset.jsonl
  long_context:
    dataset: perf_jsonl
    dataset_params:
      scenario: long_context
      path: dataset/test/performance/testset.jsonl
  math_logic:
    dataset: perf_jsonl
    dataset_params:
      scenario: math_logic
      path: dataset/test/performance/testset.jsonl
  coding:
    dataset: perf_jsonl
    dataset_params:
      scenario: coding
      path: dataset/test/performance/testset.jsonl
  general_agent:
    dataset: perf_jsonl
    dataset_params:
      scenario: general_agent
      path: dataset/test/performance/testset.jsonl
  search_agent:
    dataset: perf_jsonl
    dataset_params:
      scenario: search_agent
      path: dataset/test/performance/testset.jsonl
  multilingual:
    dataset: perf_jsonl
    dataset_params:
      scenario: multilingual
      path: dataset/test/performance/testset.jsonl
sampling:
  seed: 42
  targets_per_scenario: 10
  method: sha256(seed|upstream_id) order + stratified largest remainder
buckets:
  1k: 1024
  4k: 4096
  32k: 32768
max_tokens: 50
strict_input_tokens: true
