# Quick performance test set: the deterministic 240-row subset of the default
# performance samples (8 scenarios x 1K/8K/32K x 10 targets).
#
# The subset payload lives next to the full set and is generated by
# tool/dataset/build_perf_subset.py; only this YAML is committed.
name: performance_10
title: 性能测试快速子集（8 场景 × 1K/8K/32K × 10）
description: >-
  引用 dataset/test/performance/testset_10.jsonl（240 measured / 24 cells）。
  每个场景保留 20 个 target 中的 10 个，每个 target 仍有 1K/8K/32K 三条，
  因此“同题不同长”性质不变；与 performance 共用同一批样本，不可当作独立证据。
scenarios:
  knowledge_qa:
    dataset_params:
      path: dataset/test/performance/testset_10.jsonl
  instruction_following:
    dataset_params:
      path: dataset/test/performance/testset_10.jsonl
  long_context:
    dataset_params:
      path: dataset/test/performance/testset_10.jsonl
  math_logic:
    dataset_params:
      path: dataset/test/performance/testset_10.jsonl
  coding:
    dataset_params:
      path: dataset/test/performance/testset_10.jsonl
  general_agent:
    dataset_params:
      path: dataset/test/performance/testset_10.jsonl
  search_agent:
    dataset_params:
      path: dataset/test/performance/testset_10.jsonl
  chinese_long_context:
    dataset_params:
      path: dataset/test/performance/testset_10.jsonl
