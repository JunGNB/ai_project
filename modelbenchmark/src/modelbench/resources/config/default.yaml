# Global benchmark configuration.
#
# API keys: prefer the OMLX_API_KEY environment variable; when absent the
# harness falls back to the local oMLX app settings (~/.omlx/settings.json).
#
# Model loading uses oMLX defaults.  Only MoE models may explicitly enable
# ``moe_expert_offload_enabled`` in models.yaml (see docs/spec/21-test-plan.md).
server:
  base_url: "http://127.0.0.1:8000"
  api_key: null
  api_key_env: OMLX_API_KEY
  api_key_from_omlx_settings: true
  omlx_settings_path: "~/.omlx/settings.json"
  admin_api_key: null
  admin_api_key_env: OMLX_ADMIN_API_KEY
  request_timeout_s: 900
  connect_timeout_s: 10
  verify_ssl: true
  pid_file: null

# Performance benchmark settings (the only test mode).
perf:
  # Samples taken from EACH selected dataset, after dataset_params limits.
  # null / omitted = test every available sample.
  samples_per_dataset: null
  # Optional context-window filter (tokens, 1024 = 1K).  Empty = every bucket.
  # Selected windows combine as a union: 1K accepts 0..1.5K tokens; every other
  # N accepts N-0.5K..N+0.5K.  The filter only selects samples; cells are always
  # keyed by (scenario, dataset, context_length) from the sample metadata.
  context_windows: []
  # Uniform generation length (OSL): default 50 (product requirement).  Hitting
  # this cap is NOT data loss: the sample keeps finish_reason=length and TG TPS
  # is computed over the actually generated token window (needs >= 16 tokens).
  # CLI `--max-tokens` / Web "生成长度" input can override per run.
  max_tokens: 50
  # Append a fixed long-output instruction to every performance request so a
  # prompt ending in "Answer:" cannot finish in 1 token (which would make
  # TG TPS null).  This is a measurement-protocol suffix, recorded verbatim in
  # records.jsonl; disable only for diagnostics / historical comparisons.
  decode_guard: true

run:
  output_dir: output
  repeats: 1                 # measured repeats per sample (1 = one result per sample)
  # oMLX-style model warmup: one short request after each model load, before
  # any measured cell; discarded, never aggregated.  Mirrors oMLX's default
  # QUICK warmup (32 prompt tokens, max_tokens=8) that triggers JIT/Metal
  # shader compilation.  Set 0 only for diagnostics/old-result reproduction.
  warmup_per_model: 1
  # Legacy/diagnostic per-cell warmup.  Keep 0 for normal runs; enabling this
  # repeats a short request in every (scenario, bucket) cell and is expensive
  # on the 32K cells.
  warmup_requests: 0
  max_retries: 2
  retry_backoff_s: 2.0
  cache_mode: cold           # cold | warm | none (see docs/spec/20-methodology.md)
  cache_settle_ms: 800
  isolate_models: true       # unload other models before measuring one
  restore_state: true        # clear caches / unload models after the run
  cpu_sample_interval_ms: 50
  seed: null
  thinking_mode: disabled
  fail_fast: false
  context_safety_margin_tokens: 128
  max_contamination_retries: 1
  max_requests: null         # global safety cap on measured requests (null = unlimited)

datasets:
  # Runtime data roots.  The performance test set lives under testset_dir
  # (dataset/test/performance/testset.jsonl, generated by
  # tool/dataset/performance/build.py).
  testset_dir: dataset/test
  raw_dir: dataset/raw
  processed_dir: dataset/processed

models_file: src/modelbench/resources/config/models.yaml
scenarios_file: src/modelbench/resources/config/scenarios.yaml
