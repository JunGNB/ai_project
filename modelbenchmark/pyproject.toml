[project]
name = "omlx-modelbenchmark"
version = "0.3.0"
description = "Local LLM performance benchmark harness for oMLX: per-sample TTFT/TG TPS/memory with hardware and oMLX configuration snapshots"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "modelbenchmark" }]
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.6,<3.0",
  "PyYAML>=6.0",
  "psutil>=5.9",
  "numpy>=1.26",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]
# Dataset rebuild (`tool/dataset/build_*.py`): parquet readers + the portable
# tokenizer backend used when oMLX.app is not available (Windows/CI).
datasets = ["pyarrow>=15.0", "tokenizers>=0.15", "jinja2>=3.1"]
# Accuracy judging (`tool/system/judges.py`): the official IFEval checker code
# imports absl/langdetect/nltk; LongBench's Chinese QA/ROUGE metrics need jieba
# and the `rouge` package.  The local judge self-check also reads parquet
# (already covered by the `datasets` extra).
eval = [
  "nltk>=3.9",
  "langdetect>=1.0.9",
  "absl-py>=2.0",
  "immutabledict>=4.0",
  "jieba>=0.42",
  "rouge>=1.0",
]


[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"
markers = [
  "live: requires a running oMLX server (deselect with -m 'not live')",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["modelbench*"]

[tool.setuptools.package-data]
modelbench = [
  "resources/config/*.yaml",
  "interfaces/web/static/*",
]
