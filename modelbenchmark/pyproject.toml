[project]
name = "omlx-modelbenchmark"
version = "0.3.0"
description = "Local LLM performance benchmark harness for oMLX: per-sample TTFT/TG TPS/memory with hardware and oMLX configuration snapshots"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "modelbenchmark" }]
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.6,<3.0",
  "PyYAML>=6.0",
  "psutil>=5.9",
  "numpy>=1.26",
  "openpyxl>=3.1,<4",
  # Accuracy judging is a core method: the deterministic judges must work on a
  # plain install.  The IFEval checker imports absl/langdetect/nltk/
  # immutabledict, and normalized_match's Chinese F1/ROUGE needs jieba/rouge.
  # Leaving these optional used to turn whole scenarios into silent
  # judge_error=0 scores; see CHANGELOG 2026-11-19.
  "nltk>=3.9",
  "langdetect>=1.0.9",
  "absl-py>=2.0",
  "immutabledict>=4.0",
  "jieba>=0.42",
  "rouge>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]
# Dataset rebuild (`tool/dataset/build_*.py`): parquet readers + the portable
# tokenizer backend used when oMLX.app is not available (Windows/CI).
datasets = ["pyarrow>=15.0", "tokenizers>=0.15", "jinja2>=3.1"]
# Kept as an empty alias for backwards compatibility: the former eval-only
# dependencies are core now, so `pip install -e ".[eval]"` still resolves.
eval = []


[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"
markers = [
  "live: requires a running oMLX server (deselect with -m 'not live')",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["modelbench*"]

[tool.setuptools.package-data]
modelbench = [
  "resources/config/*.yaml",
  "interfaces/web/static/*",
]
# Vendored judge assets: the official IFEval checker (.py, packaged with the
# package automatically) plus the English NLTK punkt data the checker needs.
# Shipping both keeps accuracy judging fully offline after a plain install.
"modelbench.domain.judges._vendor" = [
  "nltk_data/tokenizers/punkt/*.pickle",
  "nltk_data/tokenizers/punkt_tab/english/*",
]
